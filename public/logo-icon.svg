<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- Fundo violeta com cantos arredondados -->
  <rect width="44" height="44" rx="11" fill="#7C3AED"/>
  <!-- Letra E estilizada (barra vertical + 3 horizontais de larguras diferentes = hierarquia de página) -->
  <!-- Barra vertical esquerda -->
  <rect x="10" y="8" width="4" height="28" rx="2" fill="white"/>
  <!-- Barra superior (longa) -->
  <rect x="10" y="8" width="22" height="4" rx="2" fill="white"/>
  <!-- Barra central (curta — hierarquia visual) -->
  <rect x="10" y="20" width="15" height="4" rx="2" fill="white"/>
  <!-- Barra inferior (longa) -->
  <rect x="10" y="32" width="22" height="4" rx="2" fill="white"/>
</svg>
